# Stack-agnostic security checks.
# Also turn on in GitHub → Settings → Code security:
#   • CodeQL "Default setup" (detects your languages automatically, incl. Swift/Kotlin/Java/C#/Go/Python/JS)
#   • Secret scanning + push protection
#   • Dependabot alerts
name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1" # weekly, Monday 04:17 UTC

permissions:
  contents: read

jobs:
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Gitleaks (CLI via container; no license key needed)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
            detect --source=/repo --redact --verbose --exit-code=1

  audit:
    name: audit
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v4
      - name: Dependency vulnerability audit (command from .project/commands.env)
        run: ./scripts/task.sh audit

  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0, AGPL-3.0
          comment-summary-in-pr: on-failure
